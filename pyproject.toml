[project]
name = "wsp"
version = "0.1.0"
description = "Cliente de WhatsApp minimalista para la terminal de macOS"
requires-python = ">=3.12"
dependencies = [
    "neonize",
    "pydantic>=2",
    "prompt_toolkit>=3",
    "keyring",
]

[project.scripts]
wsp = "wsp.cli.main:main"
wspd = "wsp.daemon.main:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pre-commit",
    "detect-secrets",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wsp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
