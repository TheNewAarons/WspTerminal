[project]
name = "wsp"
version = "0.1.0"
description = "Cliente de WhatsApp minimalista para la terminal de macOS"
requires-python = ">=3.12"
dependencies = [
    "neonize>=0.5.2,<0.6",
    "pydantic>=2,<3",
    "prompt_toolkit>=3,<4",
    "keyring>=25,<26",
    "structlog>=25,<27",
    "rapidfuzz>=3,<4",
    "qrcode>=8,<9",
]

[project.scripts]
wsp = "wsp.cli.main:app"
wspd = "wsp.daemon.main:run"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "pre-commit",
    "detect-secrets",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wsp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["neonize", "neonize.*", "qrcode", "qrcode.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
environments = ["sys_platform == 'darwin'"]
